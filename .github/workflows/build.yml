name: Build Kames

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kames.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/kames.jks" >> "$GITHUB_ENV"
          else
            echo "No KEYSTORE_BASE64 secret: building with the debug key."
          fi

      - name: Build AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle --no-daemon bundleRelease assembleRelease

      - name: Collect files
        run: |
          mkdir out
          cp app/build/outputs/bundle/release/app-release.aab out/Kames.aab
          cp app/build/outputs/apk/release/app-release.apk out/Kames.apk
          (cd out && sha256sum Kames.apk > sha256.txt && cat sha256.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: Kames-build
          path: out/*

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/Kames.aab
            out/Kames.apk
            out/sha256.txt
